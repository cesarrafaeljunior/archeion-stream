services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: crflix-jellyfin

    user: "${PUID}:${PGID}"

    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"

    volumes:
      - ../../config:/config
      - ../../cache:/cache
      - ../../media:/media:ro
      # Use um ponto de montagem estavel. O operador `:?` impede que o Docker
      # suba silenciosamente com uma biblioteca vazia quando a variavel faltar.
      - ${MEDIA_ROOT:?Defina MEDIA_ROOT no arquivo .env}:/media-hd:ro

    restart: unless-stopped
