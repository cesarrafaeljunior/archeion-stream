services:

  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: crflix-jellyfin

    user: "${PUID}:${PGID}"

    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"

    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media:/media:ro

    restart: unless-stopped